<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Weather App</title>
    </head>
    <body>
        <div class="card">
            <div class="search">
                <input type="text" placeholder="Enter city name">
                <button><img src="search.png" alt="img not found"></button>
            </div>
            <button class="location-btn">📍 Use my location</button>
            <div class="error">
                <p>Invalid city name</p>
            </div>
            <div class="weather">
                <img src="rain.png" alt="img not found" class="weather-icon">
                <h1 class="temp">22°C</h1>
                <button class="unit-btn">Switch to °F</button>
                <h2 class="city">New York</h2>
                <div class="details">
                    <div class="col">
                        <img src="humidity.png">
                    <div>
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
                </div>
                <div class="col">
                        <img src="wind.png">
                    <div>
                    <p class="wind">15 km/h</p>
                    <p>Wind Speed</p>
                </div>
                </div>
            </div>
        </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
